name: Build authentic Tabler icons
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-icons.mjs'
      - 'javascripts/discourse/api-initializers/**'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical Tabler sprite
        run: node scripts/build-icons.mjs
      - name: Commit generated sprite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icons-sprite.svg
          git diff --cached --quiet || (git commit -m "Build sprite from upstream Tabler Icons" && git push)
